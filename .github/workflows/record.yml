name: Record Stream
run-name: "Recording: ${{ github.event.inputs.label || github.event.inputs.stream_url }}"

on:
  workflow_dispatch:
    inputs:
      stream_url:
        description: 'Target Room Web URL or Direct .m3u8 Link'
        required: true
        default: ''
      label:
        description: 'Model Name / Custom Label (Optional)'
        required: false
        default: ''

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -U "yt-dlp[default,curl-cffi]"

      - name: Download Stream with Auto-Reconnect
        run: |
          mkdir -p segments
          END_TIME=$(($(date +%s) + 18000))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            echo "Starting/Resuming stream recording at $(date)..."
            
            yt-dlp "${{ github.event.inputs.stream_url }}" \
              -o "segments/part_%(epoch)s.ts" \
              --impersonate chrome \
              --hls-use-mpegts \
              --hls-split-discontinuity \
              --fragment-retries infinite \
              --retry-sleep 5 \
              --retries 10 || true
            
            NOW=$(date +%s)
            if [ $NOW -ge $END_TIME ]; then
              echo "5-hour target reached. Stopping recording loop safely."
              break
            fi
            
            echo "Stream disconnected or ended temporarily. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Merge Video Segments
        if: always()
        run: |
          cd segments
          
          # Convert/Recover all raw .ts, .part, and .ytdl chunks to clean .mp4 files
          for chunk in *.ts *.part *.ytdl; do
            if [ -f "$chunk" ]; then
              echo "Processing chunk: $chunk"
              ffmpeg -y -i "$chunk" -c copy -fflags +genpts "clean_$(date +%s_%N).mp4" 2>/dev/null || true
              rm -f "$chunk"
            fi
          done

          FILE_COUNT=$(ls -1 clean_*.mp4 2>/dev/null | wc -l)
          
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "No video files found."
            echo "No video data recorded." > ../final_recording.txt
          elif [ "$FILE_COUNT" -eq 1 ]; then
            echo "Single segment found, finalizing..."
            cp clean_*.mp4 ../final_recording.mp4
          else
            echo "Merging $FILE_COUNT segments..."
            for f in $(ls -1v clean_*.mp4); do
              echo "file '$f'" >> filelist.txt
            done
            # Ignore corrupt timestamps and bitstream errors to ensure full continuous merge
            ffmpeg -f concat -safe 0 -i filelist.txt -c copy -fflags +genpts+igndts -err_detect ignore_err ../final_recording.mp4 || true
          fi

      - name: Clean Up Raw Chunks Before Upload
        if: always()
        run: rm -rf segments/

      - name: Upload Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorded-stream
          path: |
            final_recording.mp4
            final_recording.txt
          retention-days: 7
          compression-level: 0
