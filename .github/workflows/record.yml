name: Record Stream

on:
  workflow_dispatch:
    inputs:
      stream_url:
        description: 'Target Room Web URL'
        required: true
        default: ''

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & yt-dlp with impersonation
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -U "yt-dlp[default,curl-cffi]"

      - name: Download Stream
        run: |
          yt-dlp "${{ github.event.inputs.stream_url }}" -o "output.mp4" --impersonate chrome --concurrent-fragments 5

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recorded-stream
          path: output.mp4
          retention-days: 1
